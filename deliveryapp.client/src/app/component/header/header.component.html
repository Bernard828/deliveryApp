<header class="app-header flex justify-content-between align-items-center p-3 surface-card shadow-2">
  <!--Left Navigation-->
  <nav class="flex gap-4 align-items-center">
    <a routerLink="/home" class="font-bold">Home</a>
    <!--<a routerLink="/restaurants" class="font-bold">Restaurants</a>-->
    <a routerLink="/order" class="font-bold">Cart</a>
    <a routerLink="/admin-dashboard" class="font-bold">Admin</a>
    <button pButton icon="pi pi-shopping-cart" class="p-button-rounded p-button-text relative" (click)="openCart()">
      <span class="cart-badge" *ngIf="totalItems() > 0"> {{ totalItems() }} </span>
    </button>
  </nav>
</header>

<!--Cart Modal-->
<p-dialog [(visible)]="cartVisible" [modal]="true" [style]="{ width: '450px' }" header="Your Cart">
  <div class="flex flex-column gap-3">

    <!-- Angular 16 compatible Loop Structure -->
    <div *ngFor="let item of items" class="flex justify-content-between align-items-center border-1 surface-border p-2 border-round">
      <div>
        <div class="font-bold">{{ item.name }}</div>
        <div class="text-sm text-color-secondary">{{ item.price | currency }}</div>
      </div>
      <div class="flex align-items-center gap-2">
        <p-inputNumber [ngModel]="item.quantity" (ngModelChange)="updateQty(item.menuItemId, $event)">
        </p-inputNumber>
        <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="remove(item.menuItemId)">
        </button>
      </div>
    </div>

    <!-- Angular 16 Empty State Placeholder -->
    <p *ngIf="!items || items.length === 0" class="text-center text-color-secondary">
      Your cart is empty.
    </p>

  </div>

  <div class="flex justify-content-between align-items-center mt-4">
    <span class="font-bold text-xl">Total: {{ totalPrice() | currency }}</span>
    <button pButton label="Checkout" class="p-button-success" [disabled]="totalItems() === 0">
    </button>
  </div>
</p-dialog>
