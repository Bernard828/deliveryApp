<div class="p-5">
  <!-- Header -->
  <div class="header flex justify-between items-center mb-4">
    <h2>Explore Restaurants</h2>
    <button class="btn btn-primary" (click)="openCreateModal()">+ Add Restaurant</button>
  </div>

  <!-- Loading -->
  <div *ngIf="restaurantService.loading()" class="loading-wrap m-5">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <!-- Restaurant Grid -->
  <div class="grid">
    <ng-container *ngFor="let res of restaurants(); trackBy: trackById">

      <div class="card" (click)="selectRestaurant(res.restaurantId)">
        <div class="card-image">
          <img [src]="res.imageUrl || 'assets/default-restaurant.jpg'"
               alt="{{ res.name }}" />
        </div>

        <div class="card-body">

          <div class="card-title">{{ res.name }}</div>
          <div class="card-sub">{{ res.cuisineTypeName || 'Cuisine not specified' }}</div>
          <div class="card-meta">
            <span class="address">{{ res.address }}</span>
            <span class="status" [class.open]="res.isCurrentlyOpen" [class.closed]="!res.isCurrentlyOpen">
              {{ res.isCurrentlyOpen ? 'OPEN' : 'CLOSED' }}
            </span>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>

<!--Pagination-->
<div class="paination" *ngIf="totalPages()>1">
  <button class="btn btn-secondary"
          [disabled]="currentPage()===1"
          (click)="previousPage()">
    Previous
  </button>

  <span>Page {{ currentPage() }} of {{totalPages()}} </span>

  <button class="btn btn-secondary"
          [disabled]="currentPage()===totalPages()"
          (click)="nextPage()">
    Next
  </button>
</div>

<!-- Create Restaurant Modal -->
<div class="fd-modal-backdrop" *ngIf="displayCreateDialog()">
  <div class="fd-modal" role="dialog" aria-modal="true" aria-labelledby="createTitle">
    <header class="modal-header">
      <h3 id="createTitle">Create New Restaurant</h3>
      <button class="close-x" (click)="onCloseClicked()" aria-label="Close">✕</button>
    </header>

    <form [formGroup]="createForm"
          (ngSubmit)="onSubmit()"
          class="modal-body">

      <div class="form-row">
        <label for="name"
               class="font-bold block mb-1">
          Restaurant Name:
        </label>

        <input id="name"
               type="text"
               formControlName="name" />

        <!--<div class="field-error"
             *ngIf="
             createForm.get('name')?.touched &&
             createForm.get('name')?.invalid
             ">
          Restaurant Name is required.
        </div>-->

      </div>

      <div class="form-row">
        <label for="description">Description</label>
        <textarea id="description"
                  rows="4"
                  formControlName="description">
        </textarea>

        <!--<div class="field-error"
             *ngIf="
             createForm.get('description')?.touched &&
             createForm.get('description')?.invalid">
          Description is required.
        </div>-->

      </div>

      <div class="form-row">
        <label for="imageUrl"
               class="font-bold block mb-1">
          Upload Image:
        </label>

        <input id="imageUrl"
               type="text"
               formControlName="imageUrl" />

      </div>

      <fieldset formGroupName="address">
        <legend>Address</legend>

        <div class="form-row">
          <label for="line1">Line 1</label>
          <input id="line1"
                 type="text"
                 formControlName="line1" />
        </div>

        <div class="form-row">
          <label for="line2">Line 2</label>
          <input id="line2"
                 type="text"
                 formControlName="line2" />
        </div>

        <div class="form-row">
          <label for="city">City</label>
          <input id="city"
                 type="text"
                 formControlName="city" />
        </div>

        <div class="form-row">
          <label for="state">State</label>
          <input id="state"
                 type="text"
                 formControlName="state" />
        </div>

        <div class="form-row">
          <label for="postalCode">Zip Code</label>
          <input id="postalCode"
                 type="text"
                 formControlName="postalCode" />
        </div>

        <div class="form-row">
          <label for="country">Country</label>
          <input id="country"
                 type="text"
                 formControlName="country" />
        </div>

      </fieldset>

      <div class="modal-actions">

        <button type="button"
                class="btn btn-secondary"
                (click)="closeCreateModal()">
          Cancel
        </button>

        <!--<button type="submit"
                class="btn btn-primary"
                [disabled]="createForm.invalid || submitting()">
          {{ submitting() ? 'Creating...' : 'Create Restaurant' }}
        </button>-->

      </div>

    </form>

  </div>

</div>

<!-- Menu modal component (attributes on opening tag) -->
<app-restaurant-menu-modal [visible]="displayMenuDialog()"
                           [restaurantName]="selectedRestaurantMenu()?.name || ''"
                           [menuItems]="selectedRestaurantMenu()?.menuItems || []">
</app-restaurant-menu-modal>
